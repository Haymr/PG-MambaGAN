# =============================================
# PG-MambaGAN Default Configuration
# VRAM-Optimized for T4/RTX3080 (16GB)
# =============================================

model:
  generator: "vss_unet"          # "vss_unet" or "unet_baseline"
  discriminator: "patchgan_sn"
  img_size: 256
  channels: 1

generator:
  embed_dim: 96
  depths: [2, 2, 4, 2]          # VSS blocks per stage
  patch_size: 2
  drop_rate: 0.0
  drop_path_rate: 0.2
  gradient_checkpointing: true   # ⚠️ MANDATORY — ~60% VRAM savings

discriminator:
  filters: [64, 128, 256, 512]
  use_spectral_norm: true

loss:
  gradient_penalty: 1.0
  nps_tissue_weights:
    soft_tissue: 2.0
    lung: 1.5
    fat: 1.0
    bone: 0.0
    air: 0.0
  nps_mask_source: "ndct"        # ⚠️ MANDATORY — masking from ground truth
  nps_morphological_kernel: 5    # closing/opening kernel size

  # Per-weight piecewise schedule. type ∈ {constant, linear, cosine}.
  # Phase 1 (ep 0-5):   pure L1 + perceptual warmup — structure first
  # Phase 2 (ep 5-20):  adv & NPS ramp in linearly  — introduce texture
  # Phase 3 (ep 20+):   cosine-anneal L1 down, NPS up — fine-tune realism
  schedule:
    l1:
      - {start_epoch: 0,  end_epoch: 5,   start_val: 50.0, end_val: 50.0, type: constant}
      - {start_epoch: 5,  end_epoch: 120, start_val: 50.0, end_val: 15.0, type: cosine}
    adv:
      - {start_epoch: 0,  end_epoch: 5,   start_val: 0.0,  end_val: 0.0,  type: constant}
      - {start_epoch: 5,  end_epoch: 20,  start_val: 0.0,  end_val: 1.0,  type: linear}
      - {start_epoch: 20, end_epoch: 120, start_val: 1.0,  end_val: 1.0,  type: constant}
    nps:
      - {start_epoch: 0,  end_epoch: 5,   start_val: 0.0,  end_val: 0.0,  type: constant}
      - {start_epoch: 5,  end_epoch: 20,  start_val: 0.0,  end_val: 5.0,  type: linear}
      - {start_epoch: 20, end_epoch: 120, start_val: 5.0,  end_val: 15.0, type: cosine}
    perceptual:
      - {start_epoch: 0,  end_epoch: 120, start_val: 10.0, end_val: 10.0, type: constant}
    freq:
      - {start_epoch: 0,  end_epoch: 120, start_val: 1.0,  end_val: 1.0,  type: constant}

training:
  epochs: 120
  batch_size: 32
  gradient_accumulation: 1
  learning_rate_g: 1.0e-4
  learning_rate_d: 1.0e-4
  beta1: 0.0
  beta2: 0.99
  n_critic: 5
  ema_decay: 0.99
  mixed_precision: true          # ⚠️ BFloat16 AMP
  precision_dtype: "bfloat16"    # "bfloat16" or "float16"
  scheduler: "cosine"
  warmup_epochs: 5

data:
  dataset: "mayo"
  total_patients: 300
  data_root: null                # Set via CLI: --data-path
  structure: "flat"              # "patient_folders" or "flat"
  patient_split:
    train_ratio: 0.8             # 240 patients
    val_ratio: 0.1               # 30 patients
    test_ratio: 0.1              # 30 patients
  augmentation:
    horizontal_flip: true
    vertical_flip: false
    rotation: true
    scale_range: [0.95, 1.05]

# Platform-independent paths
paths:
  data_root: null                # CLI: --data-path
  output_dir: "experiments"
  checkpoint_dir: null           # null → output_dir/checkpoints

wandb:
  project: "pg-mambagan"
  entity: null
  log_images_every: 1
  log_gradients: true
