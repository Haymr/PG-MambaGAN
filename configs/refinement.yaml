# =============================================
# PG-MambaGAN Texture Refinement Config v3
# Fine-tune from best.pth (epoch 78) — THE GOLDEN RATIO
# v2 post-mortem: We accidentally dropped L1 from its actual epoch 78 
#                 effective value (24.7) down to 15.0, causing PSNR drift.
# v3 strategy: Freeze weights exactly at Epoch 78 optimum and use cosine LR
#              to let the model organically settle into the local minimum.
# =============================================

model:
  generator: "vss_unet"
  discriminator: "patchgan_sn"
  img_size: 512
  channels: 1

generator:
  embed_dim: 96
  depths: [2, 2, 4, 2]
  patch_size: 2
  drop_rate: 0.0
  drop_path_rate: 0.1
  gradient_checkpointing: true

discriminator:
  filters: [64, 128, 256, 512]
  use_spectral_norm: false

loss:
  lambda_adv: 1.0                # Restored to original golden ratio
  lambda_perceptual: 10.0
  lambda_freq: 1.0

  # L1: Frozen at effective Epoch 78 value (24.7 -> rounded to 25.0)
  l1_start: 25.0
  l1_end: 25.0

  # NPS: Frozen at effective Epoch 78 value (11.4 -> rounded to 11.0)
  nps_start: 11.0
  nps_end: 11.0

  gradient_penalty: 10.0
  nps_tissue_weights:
    soft_tissue: 2.0
    lung: 1.5
    fat: 1.0
    bone: 0.0
    air: 0.0
  nps_mask_source: "ndct"
  nps_morphological_kernel: 5

training:
  epochs: 30                     # Will likely stop early via patience
  batch_size: 8
  gradient_accumulation: 1
  learning_rate_g: 2.0e-5        # Recommended mid-range for settling
  learning_rate_d: 2.0e-5        
  beta1: 0.0
  beta2: 0.99
  n_critic: 5                    # Stable WGAN-GP
  ema_decay: 0.999
  mixed_precision: true
  precision_dtype: "bfloat16"
  scheduler: "cosine"            # Smooth settling into the minimum
  warmup_epochs: 0

data:
  dataset: "mayo"
  total_patients: 300
  data_root: null
  structure: "flat"
  patient_split:
    train_ratio: 0.8
    val_ratio: 0.1
    test_ratio: 0.1
  augmentation:
    horizontal_flip: true
    vertical_flip: false
    rotation: true
    scale_range: [0.95, 1.05]

paths:
  data_root: null
  output_dir: "experiments/refinement_v3"
  checkpoint_dir: null

wandb:
  project: "pg-mambagan-refinement-v3"
  entity: null
  log_images_every: 1
  log_gradients: true
