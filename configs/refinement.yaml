# =============================================
# PG-MambaGAN Texture Refinement Config v2
# Fine-tune from best.pth (epoch 78) — FRESH START
# v1 post-mortem: L1 drop too aggressive (3→1) + adv too high (2.0)
#                 → Discriminator dominated → Generator output corrupted
# v2 strategy: Minimal intervention — L1 15→10, adv 1.5, LR 5e-6
# =============================================

model:
  generator: "vss_unet"
  discriminator: "patchgan_sn"
  img_size: 512
  channels: 1

generator:
  embed_dim: 96
  depths: [2, 2, 4, 2]
  patch_size: 2
  drop_rate: 0.0
  drop_path_rate: 0.1            # Slightly lower — stability during fine-tuning
  gradient_checkpointing: true

discriminator:
  filters: [64, 128, 256, 512]
  use_spectral_norm: false

loss:
  lambda_adv: 1.5                # 1.0→1.5: Minimal adversarial boost (v1=2.0 was too aggressive)
  lambda_perceptual: 10.0        # Unchanged
  lambda_freq: 1.0               # Unchanged

  # L1: Cosine decay 15→10 (only 33% reduction — v1's 3→1 was 93% drop = fatal)
  l1_start: 15.0                 # Same as where original training ended
  l1_end: 10.0                   # Gentle relaxation — structural anchor stays strong

  # NPS: Fixed at maximum — physics constraint must not degrade
  nps_start: 15.0
  nps_end: 15.0

  gradient_penalty: 10.0
  nps_tissue_weights:
    soft_tissue: 2.0
    lung: 1.5
    fat: 1.0
    bone: 0.0
    air: 0.0
  nps_mask_source: "ndct"
  nps_morphological_kernel: 5

training:
  epochs: 30                     # 30 epochs — manual stop if needed
  batch_size: 8
  gradient_accumulation: 1
  learning_rate_g: 5.0e-6        # 4x lower than v1 — protect pre-trained weights
  learning_rate_d: 5.0e-6        # Equal to G — remove D advantage (v1 D dominated)
  beta1: 0.0
  beta2: 0.99
  n_critic: 5                    # Restored to original — more stable WGAN-GP
  ema_decay: 0.999
  mixed_precision: true
  precision_dtype: "bfloat16"
  scheduler: "constant"          # Fixed LR
  warmup_epochs: 0               # No warmup — pre-trained model

data:
  dataset: "mayo"
  total_patients: 300
  data_root: null
  structure: "flat"
  patient_split:
    train_ratio: 0.8
    val_ratio: 0.1
    test_ratio: 0.1
  augmentation:
    horizontal_flip: true
    vertical_flip: false
    rotation: true
    scale_range: [0.95, 1.05]

paths:
  data_root: null
  output_dir: "experiments/refinement_v2"
  checkpoint_dir: null

wandb:
  project: "pg-mambagan-refinement-v2"
  entity: null
  log_images_every: 1
  log_gradients: true
